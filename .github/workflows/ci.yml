name: CI / CD

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write      # GitHub OIDC -> AWS role (no long-lived keys)
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + local end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src glue_jobs airflow tests tools
      - run: pytest

  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy-dev:
    name: Deploy to dev
    needs: [ test, terraform ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=envs/dev.backend.hcl
      - run: terraform apply -auto-approve -var-file=envs/dev.tfvars
      - name: Smoke run (tiny data) via Glue
        run: |
          for job in generate-landing bronze-ingest silver-build gold-build data-health; do
            args='{}'; [ "$job" = "generate-landing" ] && args='{"--mode":"history","--scale":"tiny"}'
            [ "$job" = "data-health" ] && args='{"--fail_on_critical":"false"}'
            id=$(aws glue start-job-run --job-name wm-dev-$job --arguments "$args" --query JobRunId --output text)
            while true; do
              s=$(aws glue get-job-run --job-name wm-dev-$job --run-id $id --query JobRun.JobRunState --output text)
              [ "$s" = "SUCCEEDED" ] && break
              case "$s" in FAILED|TIMEOUT|STOPPED|ERROR) echo "$job $s"; exit 1;; esac
              sleep 20
            done
          done

  deploy-prod:
    name: Deploy to prod (manual approval)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod   # protected environment with required reviewers
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ca-central-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=envs/prod.backend.hcl
      - run: terraform plan -var-file=envs/prod.tfvars -out=tfplan
      - run: terraform apply -auto-approve tfplan
