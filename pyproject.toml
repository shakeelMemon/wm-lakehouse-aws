[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wm_common*"]

[tool.setuptools.package-data]
wm_common = ["sql/*.yml", "sql/gold/*.sql", "sql/athena/*.sql"]

[project]
name = "wm-performance-lakehouse-aws"
version = "1.0.0"
description = "Wealth Management performance reporting lakehouse on AWS: S3, Glue (PySpark), Iceberg, Athena, Lake Formation, Airflow, SageMaker Unified Studio and Power BI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyspark==3.5.3", "pyarrow>=14", "ruff>=0.5", "sqlglot>=25", "boto3>=1.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]
